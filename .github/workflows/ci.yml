# Verification only: type check, lint, tests and a production build from a clean checkout.
# No deployment, no secrets. The API URL below is a synthetic dead address so nothing can
# reach the production fallback in lib/api-config.ts (F-32); it also becomes the target of
# the /api/v1 rewrite. Build-time downloads still need the network: the npm registry
# (npm ci) and Google Fonts (next/font/google during next build).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9/api/v1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit -p . --incremental false
      - name: Lint
        run: npm run lint
      - name: Lint baseline (no new findings)
        run: npm run lint:baseline
      - name: Tests
        run: npx vitest run --maxWorkers=2
      - name: Production build
        run: npx next build
